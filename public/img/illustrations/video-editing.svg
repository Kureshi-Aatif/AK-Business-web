<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <defs>
    <filter id="veShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="20" stdDeviation="18" flood-color="#0B3FD8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Offset card frame -->
  <rect x="52" y="42" width="396" height="316" rx="28" fill="#0B3FD8" opacity="0.12"/>
  <rect x="40" y="30" width="396" height="316" rx="28" fill="#ffffff" stroke="#D5DEF5" stroke-width="2" filter="url(#veShadow)"/>

  <!-- Video editing studio artwork -->
  <g transform="translate(80, 65)">
    <!-- Main Video Frame -->
    <rect width="250" height="150" rx="12" fill="#071A57" stroke="#2E6BFF" stroke-width="2"/>
    <!-- Play button overlay -->
    <circle cx="125" cy="75" r="28" fill="#FF7A1A"/>
    <polygon points="120,63 138,75 120,87" fill="#ffffff"/>

    <!-- Timeline Tracks beneath -->
    <g transform="translate(0, 160)">
      <rect width="340" height="18" rx="4" fill="#050F36"/>
      <rect x="20" y="3" width="90" height="12" rx="3" fill="#0B3FD8"/>
      <rect x="115" y="3" width="120" height="12" rx="3" fill="#2E6BFF"/>
      <rect x="240" y="3" width="70" height="12" rx="3" fill="#FF7A1A"/>

      <!-- Audio Track -->
      <g transform="translate(0, 24)">
        <rect width="340" height="16" rx="4" fill="#050F36"/>
        <!-- Audio waveform bars -->
        <line x1="20" y1="8" x2="20" y2="14" stroke="#25D366" stroke-width="2"/>
        <line x1="26" y1="4" x2="26" y2="16" stroke="#25D366" stroke-width="2"/>
        <line x1="32" y1="6" x2="32" y2="12" stroke="#25D366" stroke-width="2"/>
        <line x1="38" y1="2" x2="38" y2="16" stroke="#25D366" stroke-width="2"/>
        <line x1="44" y1="5" x2="44" y2="15" stroke="#25D366" stroke-width="2"/>
        <line x1="50" y1="8" x2="50" y2="14" stroke="#25D366" stroke-width="2"/>
        <line x1="56" y1="3" x2="56" y2="16" stroke="#25D366" stroke-width="2"/>
        <line x1="62" y1="7" x2="62" y2="13" stroke="#25D366" stroke-width="2"/>
      </g>
    </g>

    <!-- Smartphone Reel Frame (Vertical 9:16) -->
    <g transform="translate(265, 10)">
      <rect width="75" height="135" rx="12" fill="#071A57" stroke="#FF7A1A" stroke-width="2"/>
      <rect x="6" y="8" width="63" height="119" rx="8" fill="#0B3FD8" opacity="0.4"/>
      <circle cx="37" cy="65" r="14" fill="#FF7A1A"/>
      <polygon points="34,59 44,65 34,71" fill="#ffffff"/>
      <!-- Heart & Comment badges -->
      <circle cx="60" cy="80" r="5" fill="#FF5A5F"/>
      <circle cx="60" cy="95" r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Floating Badge: "4K High Retention" -->
  <g transform="translate(50, 290)">
    <rect width="180" height="48" rx="24" fill="#071A57" stroke="#2E6BFF" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="14" fill="#FF7A1A"/>
    <text x="24" y="28" font-family="'Sora', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">4K</text>
    <text x="48" y="24" font-family="'Sora', sans-serif" font-weight="800" font-size="12" fill="#ffffff">Reel Pacing</text>
    <text x="48" y="37" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#E6EEFF">Retention Hooks</text>
  </g>
</svg>
