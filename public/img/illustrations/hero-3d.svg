<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6EEFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F4F7FF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A57"/>
      <stop offset="100%" stop-color="#0B3FD8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050F36"/>
      <stop offset="100%" stop-color="#071A57"/>
    </linearGradient>
    <linearGradient id="chartBar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E6BFF"/>
      <stop offset="100%" stop-color="#0B3FD8"/>
    </linearGradient>
    <linearGradient id="chartBar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9B42"/>
      <stop offset="100%" stop-color="#FF7A1A"/>
    </linearGradient>
    <filter id="royalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="16" dy="24" stdDeviation="24" flood-color="#0B3FD8" flood-opacity="0.22"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071A57" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Offset Royal Blue Shadow & Main Rounded Frame -->
  <rect x="74" y="64" width="460" height="380" rx="32" fill="#0B3FD8" opacity="0.15"/>
  <rect x="60" y="50" width="460" height="380" rx="32" fill="#ffffff" stroke="#D5DEF5" stroke-width="2" filter="url(#royalShadow)"/>

  <!-- Subtle Halftone Dots in background frame -->
  <g fill="#2E6BFF" opacity="0.18">
    <circle cx="95" cy="85" r="2.5"/><circle cx="115" cy="85" r="2.5"/><circle cx="135" cy="85" r="2.5"/><circle cx="155" cy="85" r="2.5"/>
    <circle cx="95" cy="105" r="2.5"/><circle cx="115" cy="105" r="2.5"/><circle cx="135" cy="105" r="2.5"/><circle cx="155" cy="105" r="2.5"/>
    <circle cx="95" cy="125" r="2.5"/><circle cx="115" cy="125" r="2.5"/><circle cx="135" cy="125" r="2.5"/>
  </g>

  <!-- Isometric Laptop / Monitor Showcase -->
  <g transform="translate(105, 90)">
    <!-- Base -->
    <path d="M50 250 L320 250 L350 270 L20 270 Z" fill="#D5DEF5"/>
    <rect x="140" y="270" width="90" height="6" rx="3" fill="#0B3FD8" opacity="0.6"/>

    <!-- Screen Frame -->
    <rect x="40" y="30" width="290" height="200" rx="14" fill="url(#laptopGrad)"/>
    <rect x="52" y="42" width="266" height="176" rx="8" fill="url(#screenGrad)"/>

    <!-- Screen Header Bar -->
    <rect x="52" y="42" width="266" height="24" fill="#050F36"/>
    <circle cx="66" cy="54" r="3.5" fill="#FF5A5F"/>
    <circle cx="78" cy="54" r="3.5" fill="#E5A93C"/>
    <circle cx="90" cy="54" r="3.5" fill="#3CCB5A"/>
    <rect x="120" y="48" width="130" height="12" rx="6" fill="#071A57"/>

    <!-- Screen Content: Web Mockup -->
    <rect x="66" y="78" width="130" height="16" rx="4" fill="#2E6BFF"/>
    <rect x="66" y="100" width="90" height="8" rx="2" fill="#4B5B86"/>
    <rect x="66" y="112" width="105" height="8" rx="2" fill="#4B5B86" opacity="0.6"/>

    <!-- Orange CTA button on mockup -->
    <rect x="66" y="128" width="55" height="18" rx="9" fill="#FF7A1A"/>

    <!-- 3D Bar Chart inside mockup -->
    <g transform="translate(195, 80)">
      <rect x="0" y="55" width="14" height="40" rx="3" fill="url(#chartBar1)"/>
      <rect x="20" y="35" width="14" height="60" rx="3" fill="url(#chartBar1)"/>
      <rect x="40" y="15" width="14" height="80" rx="3" fill="url(#chartBar2)"/>
      <!-- Trend curve line -->
      <path d="M7 60 Q27 30 47 15" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="47" cy="15" r="4" fill="#FF7A1A" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Glass Code Box snippet -->
    <rect x="66" y="156" width="238" height="50" rx="6" fill="#0B3FD8" opacity="0.25" stroke="#2E6BFF" stroke-width="1"/>
    <text x="76" y="174" font-family="monospace" font-size="9" fill="#2E6BFF">&lt;div class=&quot;high-speed-site&quot;&gt;</text>
    <text x="86" y="188" font-family="monospace" font-size="9" fill="#3CCB5A">  &lt;status&gt;ONLINE 24/7&lt;/status&gt;</text>
    <text x="76" y="200" font-family="monospace" font-size="9" fill="#2E6BFF">&lt;/div&gt;</text>
  </g>

  <!-- Floating Smartphone Model -->
  <g transform="translate(370, 160)" filter="url(#chipShadow)">
    <rect width="105" height="195" rx="18" fill="#071A57" stroke="#2E6BFF" stroke-width="3"/>
    <rect x="8" y="12" width="89" height="171" rx="12" fill="#ffffff"/>
    <!-- Phone header -->
    <rect x="35" y="6" width="35" height="4" rx="2" fill="#2E6BFF"/>
    <rect x="18" y="24" width="69" height="18" rx="4" fill="#0B3FD8"/>
    <!-- Product Card on phone -->
    <rect x="18" y="50" width="69" height="50" rx="6" fill="#F4F7FF" stroke="#D5DEF5" stroke-width="1"/>
    <circle cx="52" cy="70" r="14" fill="#E6EEFF"/>
    <path d="M47 70 L51 74 L58 66" stroke="#0B3FD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="22" y="88" width="40" height="6" rx="2" fill="#071A57"/>
    <rect x="65" y="88" width="18" height="6" rx="2" fill="#FF7A1A"/>
    <!-- WhatsApp quick button on phone -->
    <rect x="18" y="108" width="69" height="24" rx="12" fill="#25D366"/>
    <text x="52" y="124" font-family="'DM Sans', sans-serif" font-weight="700" font-size="8.5" fill="#ffffff" text-anchor="middle">Order Now</text>
  </g>

  <!-- FLOATING CHIP 1: "Open 24/7" -->
  <g transform="translate(25, 120)" filter="url(#chipShadow)">
    <rect width="165" height="52" rx="26" fill="#ffffff" stroke="#D5DEF5" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="14" fill="#E6EEFF"/>
    <circle cx="28" cy="26" r="7" fill="#2E6BFF"/>
    <circle cx="28" cy="26" r="3" fill="#ffffff"/>
    <text x="52" y="24" font-family="'Sora', sans-serif" font-weight="800" font-size="12" fill="#071A57">Open 24/7</text>
    <text x="52" y="38" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10.5" fill="#4B5B86">Always Active</text>
  </g>

  <!-- FLOATING CHIP 2: "Found on Google" -->
  <g transform="translate(370, 70)" filter="url(#chipShadow)">
    <rect width="195" height="52" rx="26" fill="#ffffff" stroke="#D5DEF5" stroke-width="1.5"/>
    <circle cx="30" cy="26" r="15" fill="#E6EEFF"/>
    <!-- Google colored G icon -->
    <text x="30" y="32" font-family="'Sora', sans-serif" font-weight="800" font-size="16" fill="#0B3FD8" text-anchor="middle">G</text>
    <text x="54" y="24" font-family="'Sora', sans-serif" font-weight="800" font-size="12" fill="#071A57">Found on Google</text>
    <text x="54" y="38" font-family="'DM Sans', sans-serif" font-weight="700" font-size="10" fill="#FF7A1A">&#9733;&#9733;&#9733;&#9733;&#9733; #1 Rank</text>
  </g>

  <!-- FLOATING CHIP 3: "WhatsApp leads" -->
  <g transform="translate(260, 420)" filter="url(#chipShadow)">
    <rect width="190" height="54" rx="27" fill="#071A57" stroke="#2E6BFF" stroke-width="1.5"/>
    <circle cx="30" cy="27" r="15" fill="#25D366"/>
    <!-- Phone / Chat glyph -->
    <path d="M25 24 C25 21 27 20 30 20 C33 20 35 22 35 25 C35 28 33 29 32 30 C31 31 31 32 30 34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="35" r="1.5" fill="#ffffff"/>
    <text x="56" y="24" font-family="'Sora', sans-serif" font-weight="800" font-size="12" fill="#ffffff">WhatsApp Leads</text>
    <text x="56" y="39" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#E6EEFF">Instant Inquiries</text>
  </g>
</svg>
