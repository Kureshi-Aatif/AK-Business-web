<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <defs>
    <filter id="supShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="20" stdDeviation="18" flood-color="#0B3FD8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Offset card frame -->
  <rect x="52" y="42" width="396" height="316" rx="28" fill="#0B3FD8" opacity="0.12"/>
  <rect x="40" y="30" width="396" height="316" rx="28" fill="#ffffff" stroke="#D5DEF5" stroke-width="2" filter="url(#supShadow)"/>

  <!-- Support Artwork -->
  <g transform="translate(150, 70)">
    <circle cx="100" cy="95" r="75" fill="#E6EEFF"/>
    <circle cx="100" cy="95" r="55" fill="#071A57"/>

    <!-- Headset icon -->
    <path d="M70 95 C70 70 80 55 100 55 C120 55 130 70 130 95" stroke="#2E6BFF" stroke-width="5" fill="none"/>
    <rect x="63" y="85" width="14" height="25" rx="5" fill="#FF7A1A"/>
    <rect x="123" y="85" width="14" height="25" rx="5" fill="#FF7A1A"/>
    <path d="M125 105 C125 120 115 125 100 125" stroke="#2E6BFF" stroke-width="3" fill="none"/>
    <circle cx="100" cy="125" r="4" fill="#FF7A1A"/>
  </g>

  <!-- Floating Badge: "1-Year Support Included" -->
  <g transform="translate(130, 275)">
    <rect width="240" height="52" rx="26" fill="#071A57" stroke="#2E6BFF" stroke-width="2"/>
    <circle cx="28" cy="26" r="15" fill="#FF7A1A"/>
    <path d="M22 26 L26 30 L34 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="52" y="26" font-family="'Sora', sans-serif" font-weight="800" font-size="12" fill="#ffffff">1 Year Support</text>
    <text x="52" y="39" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10.5" fill="#E6EEFF">Setup &amp; Maintenance Included</text>
  </g>
</svg>
