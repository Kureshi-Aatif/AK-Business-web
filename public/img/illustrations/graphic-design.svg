<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <defs>
    <filter id="gdShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="20" stdDeviation="18" flood-color="#0B3FD8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Offset card frame -->
  <rect x="52" y="42" width="396" height="316" rx="28" fill="#0B3FD8" opacity="0.12"/>
  <rect x="40" y="30" width="396" height="316" rx="28" fill="#ffffff" stroke="#D5DEF5" stroke-width="2" filter="url(#gdShadow)"/>

  <!-- Graphic Studio Artwork: Palette & Vector Pen -->
  <g transform="translate(100, 70)">
    <!-- Swatch cards -->
    <rect x="20" y="30" width="75" height="110" rx="8" fill="#071A57" transform="rotate(-15 20 30)"/>
    <rect x="25" y="35" width="65" height="65" rx="4" fill="#0B3FD8" transform="rotate(-15 20 30)"/>

    <rect x="80" y="20" width="75" height="110" rx="8" fill="#F4F7FF" stroke="#D5DEF5" stroke-width="1.5"/>
    <rect x="85" y="25" width="65" height="65" rx="4" fill="#2E6BFF"/>
    <rect x="90" y="100" width="45" height="8" rx="2" fill="#071A57"/>

    <rect x="150" y="30" width="75" height="110" rx="8" fill="#F4F7FF" stroke="#D5DEF5" stroke-width="1.5" transform="rotate(15 150 30)"/>
    <rect x="155" y="35" width="65" height="65" rx="4" fill="#FF7A1A" transform="rotate(15 150 30)"/>

    <!-- Large Pen Tool / Vector curves -->
    <path d="M40 180 C90 120 180 210 240 150" stroke="#0B3FD8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="180" r="5" fill="#2E6BFF"/>
    <circle cx="135" cy="155" r="5" fill="#FF7A1A"/>
    <circle cx="240" cy="150" r="5" fill="#2E6BFF"/>

    <!-- Geometric Diamond Brand Mark -->
    <g transform="translate(170, 100)">
      <polygon points="50,10 90,50 50,90 10,50" fill="#071A57" stroke="#2E6BFF" stroke-width="2"/>
      <polygon points="50,25 75,50 50,75 25,50" fill="#FF7A1A"/>
    </g>
  </g>

  <!-- Floating Badge: "Vector Master Files" -->
  <g transform="translate(60, 280)">
    <rect width="185" height="48" rx="24" fill="#071A57" stroke="#2E6BFF" stroke-width="1.5"/>
    <circle cx="25" cy="24" r="14" fill="#2E6BFF"/>
    <text x="25" y="29" font-family="'Sora', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">AI</text>
    <text x="48" y="24" font-family="'Sora', sans-serif" font-weight="800" font-size="12" fill="#ffffff">Vector Quality</text>
    <text x="48" y="37" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#E6EEFF">Infinite Scalability</text>
  </g>

  <!-- Floating Badge: "Brand Identity" -->
  <g transform="translate(265, 270)">
    <rect width="175" height="48" rx="24" fill="#ffffff" stroke="#D5DEF5" stroke-width="1.5"/>
    <circle cx="25" cy="24" r="14" fill="#FF7A1A"/>
    <path d="M19 24 L23 28 L31 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="24" font-family="'Sora', sans-serif" font-weight="800" font-size="12" fill="#071A57">Brand Identity</text>
    <text x="48" y="37" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#4B5B86">Print &amp; Digital</text>
  </g>
</svg>
