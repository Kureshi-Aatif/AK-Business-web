<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <defs>
    <filter id="bsShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="20" stdDeviation="18" flood-color="#0B3FD8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Offset card frame -->
  <rect x="52" y="42" width="396" height="316" rx="28" fill="#0B3FD8" opacity="0.12"/>
  <rect x="40" y="30" width="396" height="316" rx="28" fill="#ffffff" stroke="#D5DEF5" stroke-width="2" filter="url(#bsShadow)"/>

  <!-- Automation Diagram Artwork -->
  <g transform="translate(90, 70)">
    <!-- Central Automation Hub -->
    <rect x="110" y="70" width="100" height="90" rx="16" fill="#071A57" stroke="#2E6BFF" stroke-width="2"/>
    <circle cx="160" cy="115" r="22" fill="#0B3FD8"/>
    <!-- Gear icon -->
    <path d="M160 100 L160 130 M145 115 L175 115 M150 105 L170 125 M150 125 L170 105" stroke="#FF7A1A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="160" cy="115" r="8" fill="#071A57"/>

    <!-- Left Node: Web Inquiry -->
    <rect x="0" y="15" width="85" height="60" rx="10" fill="#F4F7FF" stroke="#D5DEF5" stroke-width="1.5"/>
    <circle cx="25" cy="40" r="12" fill="#E6EEFF"/>
    <text x="25" y="44" font-family="'Sora', sans-serif" font-weight="800" font-size="11" fill="#0B3FD8" text-anchor="middle">&lt;/&gt;</text>
    <text x="46" y="38" font-family="'Sora', sans-serif" font-weight="700" font-size="9" fill="#071A57">Website</text>
    <text x="46" y="50" font-family="'DM Sans', sans-serif" font-weight="600" font-size="8" fill="#4B5B86">Lead</text>

    <!-- Right Node: WhatsApp Cloud Sync -->
    <rect x="235" y="15" width="85" height="60" rx="10" fill="#F4F7FF" stroke="#D5DEF5" stroke-width="1.5"/>
    <circle cx="260" cy="40" r="12" fill="#25D366"/>
    <text x="260" y="44" font-family="'Sora', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">WA</text>
    <text x="281" y="38" font-family="'Sora', sans-serif" font-weight="700" font-size="9" fill="#071A57">WhatsApp</text>
    <text x="281" y="50" font-family="'DM Sans', sans-serif" font-weight="600" font-size="8" fill="#25D366">Auto-Ping</text>

    <!-- Bottom Node: Admin Database -->
    <rect x="117" y="195" width="85" height="50" rx="10" fill="#F4F7FF" stroke="#D5DEF5" stroke-width="1.5"/>
    <text x="160" y="218" font-family="'Sora', sans-serif" font-weight="800" font-size="9" fill="#071A57" text-anchor="middle">Admin CRM</text>
    <text x="160" y="232" font-family="'DM Sans', sans-serif" font-weight="600" font-size="8" fill="#4B5B86" text-anchor="middle">Real-Time Sync</text>

    <!-- Connecting animated-look lines -->
    <path d="M85 45 L115 85" stroke="#2E6BFF" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M235 45 L205 85" stroke="#25D366" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M160 160 L160 195" stroke="#FF7A1A" stroke-width="2"/>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(60, 280)">
    <rect width="180" height="48" rx="24" fill="#071A57" stroke="#2E6BFF" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="14" fill="#FF7A1A"/>
    <path d="M18 24 L22 28 L30 20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="48" y="24" font-family="'Sora', sans-serif" font-weight="800" font-size="12" fill="#ffffff">Automated Flow</text>
    <text x="48" y="37" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#E6EEFF">Zero Manual Delays</text>
  </g>
</svg>
