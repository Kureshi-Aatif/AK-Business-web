<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A57" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B3FD8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="circuitLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E6BFF"/>
      <stop offset="100%" stop-color="#E6EEFF"/>
    </linearGradient>
  </defs>

  <!-- Stepped polygonal silhouette -->
  <path d="M0 0 L240 0 L190 50 L120 50 L90 80 L50 80 L30 100 L0 100 Z" fill="url(#circuitGrad)"/>

  <!-- Thin bright blue circuit traces -->
  <path d="M0 12 L180 12 L205 37" stroke="url(#circuitLineGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="205" cy="37" r="3.5" fill="#2E6BFF"/>

  <path d="M0 32 L115 32 L135 52 L170 52" stroke="#2E6BFF" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="170" cy="52" r="3" fill="#FF7A1A"/>

  <path d="M0 58 L85 58 L105 78 L125 78" stroke="url(#circuitLineGrad)" stroke-width="1.5"/>
  <circle cx="125" cy="78" r="2.5" fill="#2E6BFF"/>

  <!-- Halftone Accent Dots -->
  <g fill="#2E6BFF" opacity="0.3">
    <circle cx="22" cy="72" r="1.5"/>
    <circle cx="34" cy="72" r="1.5"/>
    <circle cx="46" cy="72" r="1.5"/>
    <circle cx="22" cy="84" r="1.5"/>
    <circle cx="34" cy="84" r="1.5"/>
    <circle cx="22" cy="96" r="1.5"/>
  </g>
</svg>
