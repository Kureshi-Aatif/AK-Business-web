<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="20" stdDeviation="18" flood-color="#0B3FD8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background offset shadow card -->
  <rect x="52" y="42" width="396" height="316" rx="28" fill="#0B3FD8" opacity="0.12"/>
  <rect x="40" y="30" width="396" height="316" rx="28" fill="#ffffff" stroke="#D5DEF5" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Desktop Browser Window -->
  <g transform="translate(75, 60)">
    <rect width="326" height="210" rx="14" fill="#071A57"/>
    <rect x="12" y="12" width="302" height="22" rx="6" fill="#050F36"/>
    <circle cx="26" cy="23" r="4" fill="#FF5A5F"/>
    <circle cx="38" cy="23" r="4" fill="#E5A93C"/>
    <circle cx="50" cy="23" r="4" fill="#3CCB5A"/>
    <rect x="70" y="16" width="160" height="14" rx="4" fill="#071A57"/>

    <!-- UI Mockup inside -->
    <rect x="12" y="46" width="140" height="152" rx="8" fill="#0B3FD8" opacity="0.2"/>
    <rect x="24" y="60" width="80" height="12" rx="4" fill="#2E6BFF"/>
    <rect x="24" y="78" width="116" height="6" rx="2" fill="#E6EEFF" opacity="0.7"/>
    <rect x="24" y="88" width="90" height="6" rx="2" fill="#E6EEFF" opacity="0.5"/>
    <rect x="24" y="104" width="70" height="22" rx="11" fill="#FF7A1A"/>

    <!-- 3D Card overlay -->
    <g transform="translate(164, 46)">
      <rect width="150" height="70" rx="8" fill="#F4F7FF"/>
      <circle cx="32" cy="35" r="18" fill="#E6EEFF"/>
      <path d="M26 35 L30 39 L38 31" stroke="#0B3FD8" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="60" y="24" width="70" height="8" rx="2" fill="#071A57"/>
      <rect x="60" y="36" width="50" height="6" rx="2" fill="#4B5B86"/>

      <!-- Second mini card -->
      <g transform="translate(0, 80)">
        <rect width="150" height="72" rx="8" fill="#F4F7FF"/>
        <rect x="16" y="16" width="30" height="30" rx="6" fill="#FF7A1A" opacity="0.2"/>
        <text x="31" y="36" font-family="'Sora', sans-serif" font-weight="800" font-size="14" fill="#FF7A1A" text-anchor="middle">&lt;&gt;</text>
        <rect x="56" y="20" width="74" height="8" rx="2" fill="#071A57"/>
        <rect x="56" y="32" width="60" height="6" rx="2" fill="#4B5B86"/>
      </g>
    </g>
  </g>

  <!-- Floating Badge: "100% Responsive" -->
  <g transform="translate(260, 290)">
    <rect width="180" height="48" rx="24" fill="#071A57" stroke="#2E6BFF" stroke-width="2"/>
    <circle cx="25" cy="24" r="14" fill="#FF7A1A"/>
    <path d="M19 24 L23 28 L31 20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="48" y="28" font-family="'Sora', sans-serif" font-weight="800" font-size="12" fill="#ffffff">Sub-Second Speed</text>
  </g>
</svg>
