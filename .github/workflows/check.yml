name: Build & Integrity Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Static Site
        run: node build.mjs

      - name: Validate HTML & Link Integrity
        run: node scripts/check-links.mjs
