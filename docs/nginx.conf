# ==============================================================================
# Nginx Reverse Proxy Configuration for AK Digital Studio
# Domain: akdigitalstudio.com (Redirect www to naked domain, HTTP to HTTPS)
# ==============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name akdigitalstudio.com www.akdigitalstudio.com;
    return 301 https://akdigitalstudio.com$request_uri;
}

# Redirect www to non-www over HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.akdigitalstudio.com;

    ssl_certificate /etc/letsencrypt/live/akdigitalstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akdigitalstudio.com/privkey.pem;

    return 301 https://akdigitalstudio.com$request_uri;
}

# Main Application Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name akdigitalstudio.com;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/akdigitalstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akdigitalstudio.com/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Root and static cache pass-through
    location /static/ {
        alias /var/www/akdigitalstudio/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Pass everything else to Node.js / Express
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20k;
    }
}
